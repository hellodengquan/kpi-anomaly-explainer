  America/North_Dakota/New_Salem: "-06:00"

output:
  report_dir: output
  default_timezone: Asia/Shanghai
  csv_encoding: utf-8-sig

recommended_defaults:
  seasonal_period:
    weekly: 7
    biweekly: 14
    monthly: 30
  normalization_threshold:
    strict: 0.15
    standard: 0.3
    lenient: 0.5
  z_threshold:
    strict: 1.5
    standard: 2.0
    lenient: 3.0

kpi_type_profiles:
  monetary:
    description: 金额类指标（营收、客单价、GMV）
    z_threshold: 2.0
    normalization_threshold: 0.30
  order_volume:
    description: 订单量/流量类指标（订单量、UV、PV）
    z_threshold: 2.0
    normalization_threshold: 0.25
  click_rate:
    description: 点击率/转化率类指标（CTR、CVR）
    z_threshold: 1.8
    normalization_threshold: 0.20
  retention:
    description: 留存/活跃类指标（DAU、次日留存）
    z_threshold: 2.0
    normalization_threshold: 0.35
  error_rate:
    description: 错误率/流失率类指标（支付失败率、流失率）
    z_threshold: 1.5
    normalization_threshold: 0.15
