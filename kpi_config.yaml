  AEST: "+10:00"
  NST: "+12:00"
  Asia/Shanghai: "+08:00"
  Asia/Beijing: "+08:00"
  Asia/Tokyo: "+09:00"
  Asia/Seoul: "+09:00"
  Asia/Singapore: "+08:00"
  Asia/Kolkata: "+05:30"
  Asia/Dubai: "+04:00"
  Asia/Hong_Kong: "+08:00"
  Asia/Taipei: "+08:00"
  America/Los_Angeles: "-08:00"
  America/New_York: "-05:00"
  America/Chicago: "-06:00"
  America/Denver: "-07:00"
  America/Sao_Paulo: "-03:00"
  Europe/London: "+00:00"
  Europe/Paris: "+01:00"
  Europe/Berlin: "+01:00"
  Europe/Moscow: "+03:00"
  Australia/Sydney: "+10:00"
